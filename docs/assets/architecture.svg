<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="960" aria-labelledby="title desc" role="img" viewBox="0 0 1360 960"><title id="title">STM32 motor controller architecture</title><desc id="desc">Analog inputs flow through ADC and circular DMA into the C acquisition layer. Digital inputs and acquisition events enter a 32-slot queue in the SysTick-paced main loop. The state machine calls assembly motor, GPIO and buzzer drivers. UART telemetry carries state and sensor values to a Python host validator. A separate emergency-stop interrupt calls motor_stop_now directly and latches a flag handled by the state machine, independently of queue capacity. Timing labels describe configured behavior, not measured latency.</desc><defs><linearGradient id="back" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#0c1626"/><stop offset="1" stop-color="#101c2f"/></linearGradient><linearGradient id="card" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#182a42"/><stop offset="1" stop-color="#132238"/></linearGradient><marker id="blue-arrow" markerHeight="8" markerWidth="8" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#69b8ff" d="M 0 0 L 10 5 L 0 10 z"/></marker><marker id="red-arrow" markerHeight="8" markerWidth="8" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#fb9b88" d="M 0 0 L 10 5 L 0 10 z"/></marker><marker id="teal-arrow" markerHeight="8" markerWidth="8" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#6dd9c4" d="M 0 0 L 10 5 L 0 10 z"/></marker><style>text{font-family:DejaVu Sans,Arial,sans-serif}.label,.title{font-weight:700}.label{font-size:13px;letter-spacing:2.5px;fill:#9ab0cc}.title{font-size:23px;fill:#f2f7ff}.body{font-size:17px;fill:#b7c8df}.code,.small{font-size:15px}.small{fill:#9eb5d1}.code{font-family:DejaVu Sans Mono,monospace;fill:#80c6ff}.box{fill:url(#card);stroke:#30445f;stroke-width:1.5}.flow{stroke:#69b8ff;marker-end:url(#blue-arrow)}.flow,.observe,.signal{fill:none;stroke-width:2.5}.signal{stroke:#fb9b88;marker-end:url(#red-arrow)}.observe{stroke:#6dd9c4;marker-end:url(#teal-arrow)}</style></defs><rect width="1360" height="960" fill="url(#back)" rx="24"/><rect width="1358" height="958" x="1" y="1" fill="none" stroke="#30445f" rx="23"/><rect width="40" height="5" x="48" y="48" fill="#6dd9c4" rx="2.5"/><text x="104" y="57" class="label">SYSTEM ARCHITECTURE</text><text x="48" y="112" fill="#f5f8ff" font-size="39" font-weight="700">From sensor input to controlled motion</text><text x="48" y="149" class="body">STM32L552 · Cortex-M33 · C application logic + ARM assembly drivers</text><line x1="48" x2="1312" y1="181" y2="181" stroke="#2b3e58"/><rect width="240" height="108" x="48" y="223" fill="#35252e" stroke="#bb776f" stroke-width="1.5" rx="14"/><text x="68" y="252" class="label" style="fill:#f6b5a9">PRIORITY PATH</text><text x="68" y="282" class="title">Emergency stop</text><text x="68" y="308" class="small" style="fill:#efc2ba">EXTI interrupt + latched flag</text><path d="M 288 277 H 1150 V 590" class="signal"/><text x="360" y="259" class="code" style="fill:#f8b5a7">ISR calls motor_stop_now()</text><circle cx="800" cy="277" r="4" fill="#fb9b88"/><path stroke-dasharray="7 7" d="M 800 281 V 590" class="signal"/><rect width="148" height="31" x="726" y="337" fill="#101c2f" rx="8"/><text x="800" y="358" class="small" text-anchor="middle" style="fill:#f6b5a9">latched condition</text><text x="990" y="312" class="small" style="fill:#efc2ba">Bypasses the event queue</text><text x="48" y="393" class="label">PHYSICAL INPUTS</text><text x="330" y="393" class="label">ACQUISITION &amp; EVENTS</text><text x="660" y="393" class="label">CONTROL</text><text x="1000" y="393" class="label">OUTPUTS</text><rect width="240" height="102" x="48" y="423" class="box" rx="14"/><text x="68" y="459" class="title">Analog inputs</text><text x="68" y="487" class="body">Potentiometer</text><text x="68" y="511" class="body">Temperature sensor</text><path d="M 288 474 H 330" class="flow"/><rect width="280" height="102" x="330" y="423" class="box" rx="14"/><text x="350" y="459" class="title" style="font-size:21px">ADC + circular DMA</text><text x="350" y="487" class="body">Averages · filtering · scaling</text><text x="350" y="511" class="code">adc_dma.c · acq.c</text><path d="M 470 525 V 590" class="flow"/><text x="487" y="560" class="small">setpoint events</text><rect width="240" height="132" x="48" y="590" class="box" rx="14"/><text x="68" y="628" class="title">Digital inputs</text><text x="68" y="658" class="body">User / touch buttons</text><text x="68" y="684" class="body">Encoder feedback</text><path d="M 288 656 H 330" class="flow"/><rect width="280" height="132" x="330" y="590" class="box" rx="14"/><text x="350" y="628" class="title">Main loop + FIFO</text><text x="350" y="658" class="body">1 ms tick · 32 event slots</text><text x="350" y="684" class="small">Producer / consumer in main</text><text x="350" y="708" class="code">main.c · evq.c</text><path d="M 610 656 H 660" class="flow"/><rect width="280" height="132" x="660" y="590" fill="#163347" stroke="#4d9db2" stroke-width="1.5" rx="14"/><text x="680" y="628" class="title">State machine</text><text x="680" y="658" class="body">Stopped · forward · reverse</text><text x="680" y="684" class="body">E-stop + acknowledgement</text><text x="680" y="708" class="code">fsm.c</text><path d="M 940 656 H 1000" class="flow"/><rect width="300" height="132" x="1000" y="590" class="box" rx="14"/><text x="1020" y="628" class="title">Assembly drivers</text><text x="1020" y="658" class="body">PWM + direction → motor</text><text x="1020" y="684" class="body">GPIO → LEDs + buzzer</text><text x="1020" y="708" class="code">motor.s · gpio.s · buzzer.s</text><path d="M 800 722 V 796" class="observe"/><text x="819" y="767" class="small" style="fill:#a5ddd2">state snapshot</text><rect width="280" height="100" x="660" y="796" fill="#153332" stroke="#3c8c80" stroke-width="1.5" rx="14"/><text x="680" y="833" class="title">UART telemetry</text><text x="680" y="861" class="body" style="font-size:16px">115200 baud · 200 ms period</text><text x="680" y="885" class="code" style="fill:#8be2d1">telem.c</text><path d="M 940 846 H 1000" class="observe"/><rect width="300" height="100" x="1000" y="796" fill="#153332" stroke="#3c8c80" stroke-width="1.5" rx="14"/><text x="1020" y="833" class="title">Python validator</text><text x="1020" y="861" class="body">Serial capture / file analysis</text><text x="1020" y="885" class="code" style="fill:#8be2d1">hote/telemetrie.py</text><text x="48" y="827" class="label" style="fill:#6dd9c4">DESIGN NOTES</text><text x="48" y="856" class="body">Bounded queues · static acquisition objects</text><text x="48" y="882" class="body">Complete-message telemetry buffering</text><text x="48" y="929" class="small">Key control and data paths. Timing labels are configured values; electrical response time requires board measurement.</text></svg>